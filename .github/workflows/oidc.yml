name: Test Vault OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test GitHub OIDC → Vault
    runs-on: deepak-ec2-runner
    environment: dev

    env:
      VAULT_ADDR: http://127.0.0.1:8200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub OIDC Token
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/deeep14" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          echo "::add-mask::$OIDC_TOKEN"
          echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Authenticate to Vault
        run: |
          RESPONSE=$(curl -sSL \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"role\":\"github-databricks-ci\",\"jwt\":\"$OIDC_TOKEN\"}" \
            "$VAULT_ADDR/v1/auth/jwt/login")

          echo "Vault response:"
          echo "$RESPONSE" | python3 -m json.tool

          VAULT_TOKEN=$(echo "$RESPONSE" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          if "auth" not in data:
              print("Vault authentication failed", file=sys.stderr)
              sys.exit(1)
          print(data["auth"]["client_token"])
          ')

          echo "::add-mask::$VAULT_TOKEN"
          echo "VAULT_TOKEN=$VAULT_TOKEN" >> "$GITHUB_ENV"

      - name: Read Databricks credentials from Vault
        run: |
          curl -sSL \
            --header "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/secret/data/databricks" \
            | python3 -m json.tool