# A sample job for databricks_vault_poc.

resources:
  jobs:
    sample_job:
      name: sample_job_v3

      permissions:
        - service_principal_name: 6f562119-1917-4f67-ab7b-db5c0196b509
          level: CAN_MANAGE

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"