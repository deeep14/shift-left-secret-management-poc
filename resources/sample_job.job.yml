# A sample job for databricks_vault_poc.

resources:
  jobs:
    sample_job:
      name: sample_job_v1

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
