# This is a Declarative Automation Bundle definition for databricks_vault_poc.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_vault_poc
  uuid: 957fda8b-8b62-4c63-b51e-0c456e810b6f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1d5bb94d-3a60.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1d5bb94d-3a60.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/masutidipu@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/masutidipu@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: masutidipu@gmail.com
        level: CAN_MANAGE
